name: Backend integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: zy2_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:integration@127.0.0.1:5432/zy2_test
      TEST_DATABASE_URL: postgresql://postgres:integration@127.0.0.1:5432/zy2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run migrate
      - run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f test/bootstrap.sql
      - run: npm test
      - name: Build runtime image and check API readiness
        run: |
          docker build -t zy2-api:test .
          docker run -d --name zy2-api --network host \
            -e DATABASE_URL -e PGOPTIONS="-c role=zy2_api" \
            -e AUTH_ORIGIN=https://academy.example.org -e AUTH_SECRET="$(openssl rand -hex 32)" \
            -e SMTP_URL=smtps://localhost -e MAIL_FROM=test@example.org zy2-api:test
          trap 'docker logs zy2-api; docker rm -f zy2-api' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://localhost:3000/health/ready
